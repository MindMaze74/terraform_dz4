name: 'Terraform CI/CD'

on:
  push:
    branches:
      - terraform-05
  workflow_dispatch:   # ручной запуск для destroy

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    env:
      # Пробрасываем секреты в переменные окружения для backend'а S3
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2

    - name: Terraform Init
      run: terraform init
      working-directory: ./src_dz1

    - name: Terraform Plan
      run: terraform plan -lock=false
      working-directory: ./src_dz1
      env:
        TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
        TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
        TF_VAR_service_account_key_file: ""

    - name: Terraform Apply
      run: terraform apply -auto-approve -lock=false
      working-directory: ./src_dz1
      env:
        TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
        TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
        TF_VAR_service_account_key_file: ""

    - name: Terraform Destroy (manual)
      if: github.event_name == 'workflow_dispatch'
      run: terraform destroy -auto-approve -lock=false
      working-directory: ./src_dz1
      env:
        TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
        TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
        TF_VAR_service_account_key_file: ""